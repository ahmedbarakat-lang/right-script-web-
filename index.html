<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Right Script Update System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
      margin: 0;
    }
    header {
      background: #17365d;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #0000000d;
    }
    input, textarea, select, button {
      box-sizing: border-box;
      font: inherit;
      padding: 11px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      width: 100%;
      margin: 6px 0 12px;
    }
    textarea { min-height: 110px; }
    button {
      background: #2458a6;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .secondary { background: #526174; }
    .meta { color: #64748b; font-size: 13px; }
    .badge {
      display: inline-block;
      background: #fff0bd;
      color: #795400;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
    }
    .comment {
      border-left: 3px solid #cbd5e1;
      padding: 10px 12px;
      margin: 10px 0;
      background: #f8fafc;
    }
    .reply { margin-left: 22px; }
    .hidden { display: none; }
    .status { white-space: pre-wrap; }
    .login-card { max-width: 480px; margin: 40px auto; }
  </style>
</head>

<body>
<header>
  <h2>Right Script Update System</h2>
  <div id="identity">Checking sign-in...</div>
  <button id="logout" class="secondary hidden" onclick="signOutUser()">
    Sign out
  </button>
</header>

<main>
  <section id="login" class="card login-card hidden">
    <h3>Welcome</h3>
    <p>Sign in using your authorized Google account.</p>
    <button id="loginButton" onclick="signInUser()">
      Sign in with Google
    </button>
  </section>

  <div id="message" class="card status">Initializing...</div>

  <section id="admin" class="card hidden">
    <h3>Publish a new update</h3>

    <label for="topic">Inquiry Type</label>
    <input id="topic" placeholder="e.g. Refund, Cancellation">

    <label for="title">Update Title</label>
    <input id="title" placeholder="Short update title">

    <label for="content">Update Content</label>
    <textarea id="content"
      placeholder="Write the new instructions..."></textarea>

    <button id="publishButton" onclick="publish()">
      Publish Update
    </button>
  </section>

  <section id="updateSection" class="hidden">
    <h3>Published Updates</h3>
    <div id="updates"></div>
  </section>
</main>

<script>
  // =====================================================
  // 1) PASTE YOUR APPS SCRIPT WEB APP /exec URL HERE
  // =====================================================
  const API_URL = 'https://divine-firefly-77fb.ahmedbarakat-upa.workers.dev';

  // =====================================================
  // 2) Shim: lets the existing google.script.run calls
  //    talk to the Apps Script JSON API via fetch()
  // =====================================================
  async function callApi(action, args) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      action: action,
      args: args
    })
  });

  const body = await res.json();

  if (!res.ok || !body.ok) {
    throw new Error(body.error || 'Request failed.');
  }

  return body.result;
}

  function makeRunner_(ok, failHandler) {
    return new Proxy({}, {
      get: function(_, name) {
        if (name === 'withSuccessHandler') {
          return function(fn) { return makeRunner_(fn, failHandler); };
        }
        if (name === 'withFailureHandler') {
          return function(fn) { return makeRunner_(ok, fn); };
        }
        return function() {
          const args = Array.prototype.slice.call(arguments);
          return callApi(String(name), args)
            .then(function(r) { if (ok) ok(r); })
            .catch(function(e) {
              if (failHandler) failHandler(e);
              else console.error(e);
            });
        };
      }
    });
  }

  window.google = { script: { run: makeRunner_() } };

  // =====================================================
  // 3) Firebase + application code
  // =====================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCrZA8X7Hk3MdnXS1GLXP7R6KvKi4lictk",
    authDomain: "right-script-update-system.firebaseapp.com",
    projectId: "right-script-update-system",
    storageBucket: "right-script-update-system.firebasestorage.app",
    messagingSenderId: "802533311202",
    appId: "1:802533311202:web:7c1948b04e7db0fdfc94bb",
    measurementId: "G-E3V26JTES3"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let currentFirebaseUser = null;
  let currentUser = null;
  let idToken = null;
  let allUpdates = [];

  function el(id) {
    return document.getElementById(id);
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c]);
  }

  function status(message) {
    el('message').textContent = message;
  }

  function fail(error) {
    const message = error && error.message
      ? error.message
      : String(error || 'An unexpected error occurred.');

    status(message);
  }

  function serverFailure(error) {
    fail(error);
  }

  function getToken() {
    if (!currentFirebaseUser) {
      throw new Error('Please sign in first.');
    }
    return currentFirebaseUser.getIdToken();
  }

  function showLogin() {
    currentUser = null;
    idToken = null;
    allUpdates = [];

    el('identity').textContent = 'Not signed in';
    el('login').classList.remove('hidden');
    el('logout').classList.add('hidden');
    el('admin').classList.add('hidden');
    el('updateSection').classList.add('hidden');
    el('updates').innerHTML = '';
    status('Sign in with your authorized Google account.');
  }

  async function signInUser() {
    const button = el('loginButton');
    button.disabled = true;
    button.textContent = 'Opening Google sign-in...';

    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      await auth.signInWithPopup(provider);
    } catch (error) {
      let message = error.message || 'Sign-in failed.';

      if (error.code === 'auth/popup-blocked') {
        message = 'The sign-in popup was blocked. Allow popups and try again.';
      } else if (error.code === 'auth/unauthorized-domain') {
        message = 'This domain is not authorized in Firebase Authentication.';
      } else if (error.code === 'auth/popup-closed-by-user') {
        message = 'Sign-in was cancelled. Please try again.';
      }

      status(message);
    } finally {
      button.disabled = false;
      button.textContent = 'Sign in with Google';
    }
  }

  async function signOutUser() {
    try {
      await auth.signOut();
    } catch (error) {
      fail(error);
    }
  }

  auth.onAuthStateChanged(async function(user) {
    currentFirebaseUser = user;

    if (!user) {
      showLogin();
      return;
    }

    el('login').classList.add('hidden');
    el('logout').classList.remove('hidden');
    el('identity').textContent = 'Verifying account...';
    el('admin').classList.add('hidden');
    el('updateSection').classList.add('hidden');
    status('Verifying your Google account and permissions...');

    try {
      idToken = await user.getIdToken(true);
      await loadInitialData();
    } catch (error) {
      currentUser = null;
      el('identity').textContent = user.email || 'Signed in';
      el('admin').classList.add('hidden');
      el('updateSection').classList.add('hidden');
      status(error && error.message
        ? error.message
        : 'Unable to load your account. Please try again.');
    }
  });

  function loadInitialData() {
    return getToken().then(token => new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(data => {
          currentUser = data.user;
          idToken = token;
          allUpdates = data.updates || [];

          el('identity').textContent =
            currentUser.email + ' | ' + currentUser.role;

          el('login').classList.add('hidden');
          el('updateSection').classList.remove('hidden');

          if (['SUPERVISOR', 'MANAGER'].includes(currentUser.role)) {
            el('admin').classList.remove('hidden');
          } else {
            el('admin').classList.add('hidden');
          }

          status('Signed in successfully.');
          renderUpdates();
          resolve();
        })
        .withFailureHandler(error => {
          reject(new Error(error && error.message
            ? error.message
            : 'Your account could not be authorized.'));
        })
        .getInitialData(token);
    }));
  }

  async function publish() {
    if (!currentUser ||
        !['SUPERVISOR', 'MANAGER'].includes(currentUser.role)) {
      return status('Supervisor or Manager access required.');
    }

    const data = {
      topic: el('topic').value.trim(),
      title: el('title').value.trim(),
      content: el('content').value.trim()
    };

    if (!data.topic || !data.title || !data.content) {
      return status('Please complete all fields.');
    }

    const button = el('publishButton');
    button.disabled = true;
    status('Publishing...');

    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(async () => {
          el('topic').value = '';
          el('title').value = '';
          el('content').value = '';
          status('Update published successfully.');

          try {
            await loadInitialData();
          } catch (error) {
            fail(error);
          } finally {
            button.disabled = false;
          }
        })
        .withFailureHandler(error => {
          fail(error);
          button.disabled = false;
        })
        .publishUpdate(data, token);
    } catch (error) {
      fail(error);
      button.disabled = false;
    }
  }

  function renderUpdates() {
    const host = el('updates');

    if (!allUpdates.length) {
      host.textContent = 'No published updates yet.';
      return;
    }

    host.innerHTML = allUpdates.map(u => `
      <article class="card">
        <div>
          <span class="badge">${u.seen ? 'SEEN' : 'NEW'}</span>
          <span class="meta">${esc(u.topic)}</span>
        </div>
        <h3>${esc(u.title)}</h3>
        <p>${esc(u.content).replace(/\n/g, '<br>')}</p>
        <div class="meta">Published by ${esc(u.createdBy)}</div>
        <button onclick="openUpdate('${esc(u.id)}')">
          Open update &amp; comments
        </button>
        <div id="detail-${esc(u.id)}" class="hidden"></div>
      </article>
    `).join('');
  }

  async function openUpdate(id) {
    const update = allUpdates.find(u => u.id === id);
    if (!update) return status('Update not found.');

    const detail = el('detail-' + id);
    detail.classList.remove('hidden');
    detail.textContent = 'Loading comments...';

    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(comments => {
          detail.innerHTML = `
            <h4>Comments</h4>
            <div id="comments-${esc(id)}">
              ${renderComments(id, comments, isAdmin())}
            </div>
            <label for="new-${esc(id)}">Add a comment</label>
            <textarea id="new-${esc(id)}"
              placeholder="Ask a question or clarify something"></textarea>
            <button onclick="addComment('${esc(id)}')">
              Submit comment
            </button>
            ${isAdmin() ? `
              <button class="secondary"
                onclick="showReadStatus('${esc(id)}')">
                View Seen status
              </button>
              <div id="read-${esc(id)}"></div>
            ` : ''}
          `;

          if (!update.seen) {
            google.script.run
              .withSuccessHandler(() => {
                update.seen = true;
                renderUpdates();
                const newDetail = el('detail-' + id);
                if (newDetail) newDetail.classList.remove('hidden');
              })
              .withFailureHandler(serverFailure)
              .markUpdateAsSeen(id, token);
          }
        })
        .withFailureHandler(error => {
          detail.textContent = '';
          fail(error);
        })
        .getUpdateComments(id, token);
    } catch (error) {
      fail(error);
    }
  }

  function isAdmin() {
    return !!currentUser &&
      ['SUPERVISOR', 'MANAGER'].includes(currentUser.role);
  }

  function renderComments(updateId, comments, admin) {
    if (!comments.length) return '<p>No comments yet.</p>';

    return comments.map(c => `
      <div class="comment ${c.parentId ? 'reply' : ''}">
        <div class="meta">${esc(c.author)}</div>
        <p>${esc(c.comment)}</p>
        ${c.editedAt ? '<div class="meta">Edited</div>' : ''}
        ${admin ? `
          <button class="secondary"
            onclick="replyTo('${esc(updateId)}','${esc(c.id)}')">
            Reply
          </button>
          <button class="secondary"
            onclick="editComment('${esc(c.id)}','${esc(updateId)}')">
            Edit comment
          </button>
        ` : ''}
      </div>
    `).join('');
  }

  async function addComment(updateId, parentId = '') {
    const box = el('new-' + updateId);
    if (!box) return;

    const comment = box.value.trim();
    if (!comment) return status('Enter a comment first.');

    status('Submitting comment...');

    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(() => openUpdate(updateId))
        .withFailureHandler(serverFailure)
        .addUpdateComment({ updateId, comment, parentId }, token);
    } catch (error) {
      fail(error);
    }
  }

  function replyTo(updateId, parentId) {
    if (!isAdmin()) return status('Supervisor or Manager access required.');

    const reply = prompt('Write your reply:');
    if (!reply || !reply.trim()) return;

    submitReply(updateId, parentId, reply.trim());
  }

  async function submitReply(updateId, parentId, comment) {
    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(() => openUpdate(updateId))
        .withFailureHandler(serverFailure)
        .addUpdateComment({ updateId, comment, parentId }, token);
    } catch (error) {
      fail(error);
    }
  }

  async function editComment(commentId, updateId) {
    if (!isAdmin()) return status('Supervisor or Manager access required.');

    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(comments => {
          const item = comments.find(c => c.id === commentId);
          if (!item) return status('Comment not found.');

          const revised = prompt('Edit comment:', item.comment);
          if (revised === null || !revised.trim()) return;

          updateCommentText(commentId, updateId, revised.trim());
        })
        .withFailureHandler(serverFailure)
        .getUpdateComments(updateId, token);
    } catch (error) {
      fail(error);
    }
  }

  async function updateCommentText(commentId, updateId, comment) {
    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(() => openUpdate(updateId))
        .withFailureHandler(serverFailure)
        .editUpdateComment({ commentId, comment }, token);
    } catch (error) {
      fail(error);
    }
  }

  async function showReadStatus(updateId) {
    if (!isAdmin()) return status('Supervisor or Manager access required.');

    const box = el('read-' + updateId);
    if (!box) return;

    box.textContent = 'Loading...';

    try {
      const token = await getToken();

      google.script.run
        .withSuccessHandler(users => {
          box.innerHTML = '<h4>Read status</h4>' + users.map(u => `
            <div class="meta">
              ${esc(u.email)} — ${u.seen ? 'SEEN' : 'PENDING'}
              ${u.seenAt ? ' — ' + esc(u.seenAt) : ''}
            </div>
          `).join('');
        })
        .withFailureHandler(serverFailure)
        .getReadStatus(updateId, token);
    } catch (error) {
      fail(error);
    }
  }
</script>
</body>
</html>
